name: build-push-docker-master

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  subtrace/subtrace:
    name: subtrace/subtrace
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: docker login
      run: docker login ghcr.io -u "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
    - name: docker build
      run: docker build . --push --progress plain --tag "ghcr.io/subtrace/subtrace:${GITHUB_SHA}"
    - name: docker tag
      run: docker buildx imagetools create --tag ghcr.io/subtrace/subtrace:latest "ghcr.io/subtrace/subtrace:${GITHUB_SHA}"

  subtrace/worker:
    name: subtrace/worker
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: docker login
      run: docker login ghcr.io -u "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
    - name: docker build
      run: docker build . -f worker.Dockerfile --push --progress plain --tag "ghcr.io/subtrace/worker:${GITHUB_SHA}"
    - name: docker tag
      run: docker buildx imagetools create --tag ghcr.io/subtrace/worker:latest "ghcr.io/subtrace/worker:${GITHUB_SHA}"